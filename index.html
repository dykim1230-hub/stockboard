<body>
    <div id="root"></div>

    <!-- Firebase Init -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBtBqfY7t5xeMHgx1E3BMuW16H1TUvOIg4",
            authDomain: "portfolio-4ffcf.firebaseapp.com",
            projectId: "portfolio-4ffcf",
            storageBucket: "portfolio-4ffcf.firebasestorage.app",
            messagingSenderId: "399133068539",
            appId: "1:399133068539:web:73615f30a6017f8e0c345e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>

    <!-- Application Script -->
    <script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// Configuration
const BASE_URL = 'https://stockboard-fhh4.onrender.com/api';

// --- API Utilities ---
const fetchSearch = async (query) => {
    if (!query) return [];
    try {
        const res = await fetch(`${BASE_URL}/search?q=${query}`);
        const data = await res.json();
        return data || [];
    } catch (e) {
        console.error("Search API Error:", e);
        return [];
    }
};

const fetchQuote = async (symbol) => {
    try {
        const res = await fetch(`${BASE_URL}/quote?symbol=${symbol}`);
        const data = await res.json();
        return data || null;
    } catch (e) {
        console.error("Quote API Error:", e);
        return null;
    }
};

const fetchQuotes = async (symbols) => {
    if (!symbols || symbols.length === 0) return {};
    try {
        const res = await fetch(`${BASE_URL}/quotes?symbols=${symbols.join(',')}`);
        return await res.json();
    } catch (e) {
        console.error("Quotes batch API Error:", e);
        return {};
    }
};

const fetchTimeSeries = async (symbol) => {
    try {
        const res = await fetch(`${BASE_URL}/chart?symbol=${symbol}`);
        const data = await res.json();
        return data || null;
    } catch (e) {
        console.error("Time Series API Error:", e);
        return null;
    }
};

const fetchNews = async (stockName, symbol, isKorean) => {
    try {
        const params = new URLSearchParams({
            stock_name: stockName,
            is_korean: isKorean ? 'true' : 'false',
        });
        if (symbol) params.append('symbol', symbol);
        const res = await fetch(`${BASE_URL}/news?${params.toString()}`);
        const data = await res.json();
        return data || [];
    } catch (e) {
        console.error("News API Error:", e);
        return [];
    }
};

// --- Formatting Helpers ---
const formatPrice = (price, currency) => {
    if (price === null || price === undefined) return '---';
    if (currency === 'KRW') {
        return Math.round(price).toLocaleString('ko-KR') + '원';
    }
    return '$' + parseFloat(price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

const formatChange = (change, currency) => {
    if (change === null || change === undefined) return '---';
    const prefix = change > 0 ? '+' : '';
    if (currency === 'KRW') {
        return prefix + Math.round(change).toLocaleString('ko-KR') + '원';
    }
    return prefix + '$' + Math.abs(parseFloat(change)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) * Math.sign(change > 0 ? 1 : -1);
};

const formatChartTick = (val, currency) => {
    if (currency === 'KRW') {
        return Math.round(val).toLocaleString('ko-KR');
    }
    return '$' + val.toFixed(2);
};

const formatTooltip = (val, currency) => {
    if (currency === 'KRW') {
        return Math.round(val).toLocaleString('ko-KR') + '원';
    }
    return '$' + val.toFixed(2);
};

// --- Admin API helpers ---
const adminFetch = async (path, options = {}) => {
    const token = await auth.currentUser.getIdToken();
    const res = await fetch(`${BASE_URL.replace('/api', '')}${path}`, {
        ...options,
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(options.headers || {}) }
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
};

// --- Components ---

const ProfileModal = ({ isOpen, onClose, user }) => {
    const [tab, setTab] = useState('password');
    const [curPw, setCurPw] = useState('');
    const [newPw, setNewPw] = useState('');
    const [confirmPw, setConfirmPw] = useState('');
    const [digestEnabled, setDigestEnabled] = useState(false);
    const [digestHour, setDigestHour] = useState(8);
    const [error, setError] = useState('');
    const [success, setSuccess] = useState('');
    const [loading, setLoading] = useState(false);

    useEffect(() => {
        if (!isOpen) {
            setCurPw('');
            setNewPw('');
            setConfirmPw('');
            setError('');
            setSuccess('');
            setTab('password');
            return;
        }
        if (!user) return;
        db.collection('users').doc(user.uid).get().then(doc => {
            const saved = doc.exists ? doc.data().emailDigest : null;
            setDigestEnabled(Boolean(saved?.enabled));
            setDigestHour(Number.isInteger(saved?.hour) ? saved.hour : 8);
        }).catch(() => {});
    }, [isOpen, user]);

    const reauth = async (password) => {
        const credential = firebase.auth.EmailAuthProvider.credential(user.email, password);
        await auth.currentUser.reauthenticateWithCredential(credential);
    };

    const handlePasswordChange = async (e) => {
        e.preventDefault();
        if (newPw !== confirmPw) { setError('새 비밀번호가 일치하지 않습니다.'); return; }
        if (newPw.length < 6) { setError('비밀번호는 6자 이상이어야 합니다.'); return; }
        setError(''); setLoading(true);
        try {
            await reauth(curPw);
            await auth.currentUser.updatePassword(newPw);
            setSuccess('비밀번호가 변경되었습니다.');
            setCurPw(''); setNewPw(''); setConfirmPw('');
        } catch (err) {
            const msgs = { 'auth/wrong-password': '현재 비밀번호가 올바르지 않습니다.', 'auth/invalid-credential': '현재 비밀번호가 올바르지 않습니다.' };
            setError(msgs[err.code] || '오류가 발생했습니다.');
        } finally { setLoading(false); }
    };

    const handleWithdraw = async (e) => {
        e.preventDefault();
        if (!window.confirm('정말 탈퇴하시겠습니까? 모든 데이터가 삭제됩니다.')) return;
        setError(''); setLoading(true);
        try {
            await reauth(curPw);
            await db.collection('users').doc(user.uid).delete();
            await auth.currentUser.delete();
            onClose();
        } catch (err) {
            const msgs = { 'auth/wrong-password': '비밀번호가 올바르지 않습니다.', 'auth/invalid-credential': '비밀번호가 올바르지 않습니다.' };
            setError(msgs[err.code] || '오류가 발생했습니다.');
        } finally { setLoading(false); }
    };

    const handleDigestSave = async (e) => {
        e.preventDefault();
        setError('');
        setSuccess('');
        setLoading(true);
        try {
            await db.collection('users').doc(user.uid).set({
                email: user.email,
                emailDigest: {
                    enabled: digestEnabled,
                    hour: Number(digestHour),
                    timezone: 'Asia/Seoul',
                    maxNewsPerStock: 5,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                }
            }, { merge: true });
            setSuccess('메일 요약 설정이 저장되었습니다.');
        } catch (err) {
            setError('메일 요약 설정 저장에 실패했습니다.');
        } finally {
            setLoading(false);
        }
    };

    if (!isOpen || !user) return null;
    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()} style={{maxWidth:'460px'}}>
                <div className="modal-header">
                    <h2 className="modal-title">내 계정</h2>
                    <button className="close-btn" onClick={onClose}><span className="material-symbols-outlined">close</span></button>
                </div>
                <div className="modal-body">
                    <div style={{fontSize:'0.82rem', color:'var(--text-muted)', marginBottom:'1rem'}}>{user.email}</div>
                    <div style={{display:'flex', gap:'0.5rem', marginBottom:'1.25rem'}}>
                        {['password','digest','withdraw'].map(t => (
                            <button key={t} onClick={() => { setTab(t); setError(''); setSuccess(''); }}
                                className="timeframe-btn" style={{flex:1, padding:'0.5rem', fontSize:'0.8rem', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', ...(tab===t ? {background:'var(--accent-color)', color:'#fff'} : {})}}>
                                {t === 'password' ? '비밀번호' : t === 'digest' ? '메일 요약' : '회원 탈퇴'}
                            </button>
                        ))}
                    </div>

                    {tab === 'password' && (
                        <form onSubmit={handlePasswordChange} style={{display:'flex', flexDirection:'column', gap:'0.75rem'}}>
                            {[['현재 비밀번호', curPw, setCurPw], ['새 비밀번호', newPw, setNewPw], ['새 비밀번호 확인', confirmPw, setConfirmPw]].map(([label, val, set]) => (
                                <div key={label} className="search-input-wrapper">
                                    <span className="material-symbols-outlined">lock</span>
                                    <input type="password" className="search-input" placeholder={label} value={val} onChange={e => set(e.target.value)} required />
                                </div>
                            ))}
                            {error && <div style={{color:'#ef4444', fontSize:'0.85rem'}}>{error}</div>}
                            {success && <div style={{color:'#10b981', fontSize:'0.85rem'}}>{success}</div>}
                            <button type="submit" className="btn" disabled={loading} style={{justifyContent:'center'}}>
                                {loading ? '처리 중...' : '변경'}
                            </button>
                        </form>
                    )}

                    {tab === 'digest' && (
                        <form onSubmit={handleDigestSave} style={{display:'flex', flexDirection:'column', gap:'1rem'}}>
                            <label style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:'1rem', padding:'0.85rem', border:'1px solid rgba(255,255,255,0.12)', borderRadius:'8px'}}>
                                <span>
                                    <div style={{fontSize:'0.92rem', fontWeight:600}}>매일 메일 요약 받기</div>
                                    <div style={{fontSize:'0.75rem', color:'var(--text-muted)', marginTop:'0.25rem'}}>
                                        즐겨찾기 종목 전체와 종목당 뉴스 5개를 발송합니다.
                                    </div>
                                </span>
                                <input
                                    type="checkbox"
                                    checked={digestEnabled}
                                    onChange={e => setDigestEnabled(e.target.checked)}
                                    style={{width:'18px', height:'18px', flexShrink:0}}
                                />
                            </label>
                            <label style={{display:'flex', flexDirection:'column', gap:'0.45rem'}}>
                                <span style={{fontSize:'0.82rem', color:'var(--text-muted)'}}>발송 시간</span>
                                <select
                                    className="search-input"
                                    value={digestHour}
                                    onChange={e => setDigestHour(Number(e.target.value))}
                                    disabled={!digestEnabled}
                                    style={{width:'100%'}}
                                >
                                    {Array.from({ length: 24 }, (_, hour) => (
                                        <option key={hour} value={hour}>{String(hour).padStart(2, '0')}:00</option>
                                    ))}
                                </select>
                            </label>
                            <div style={{fontSize:'0.75rem', color:'var(--text-muted)', lineHeight:1.5}}>
                                선택한 시간에 하루 1회만 발송됩니다. 시간 기준은 Asia/Seoul입니다.
                            </div>
                            {error && <div style={{color:'#ef4444', fontSize:'0.85rem'}}>{error}</div>}
                            {success && <div style={{color:'#10b981', fontSize:'0.85rem'}}>{success}</div>}
                            <button type="submit" className="btn" disabled={loading} style={{justifyContent:'center'}}>
                                {loading ? '저장 중...' : '설정 저장'}
                            </button>
                        </form>
                    )}

                    {tab === 'withdraw' && (
                        <form onSubmit={handleWithdraw} style={{display:'flex', flexDirection:'column', gap:'0.75rem'}}>
                            <div style={{color:'#ef4444', fontSize:'0.85rem', padding:'0.75rem', background:'rgba(239,68,68,0.1)', borderRadius:'6px'}}>
                                탈퇴 시 즐겨찾기 등 모든 데이터가 영구 삭제됩니다.
                            </div>
                            <div className="search-input-wrapper">
                                <span className="material-symbols-outlined">lock</span>
                                <input type="password" className="search-input" placeholder="비밀번호 확인" value={curPw} onChange={e => setCurPw(e.target.value)} required />
                            </div>
                            {error && <div style={{color:'#ef4444', fontSize:'0.85rem'}}>{error}</div>}
                            <button type="submit" className="btn" disabled={loading}
                                style={{justifyContent:'center', background:'#ef4444', border:'none'}}>
                                {loading ? '처리 중...' : '탈퇴하기'}
                            </button>
                        </form>
                    )}
                </div>
            </div>
        </div>
    );
};

const AdminModal = ({ isOpen, onClose, currentUid }) => {
    const [users, setUsers] = useState([]);
    const [loading, setLoading] = useState(false);
    const [msg, setMsg] = useState('');
    const [digestLoading, setDigestLoading] = useState(false);

    useEffect(() => {
        if (!isOpen) { setMsg(''); return; }
        setLoading(true);
        adminFetch('/api/admin/users')
            .then(data => setUsers(Array.isArray(data) ? data : []))
            .catch(err => setMsg(`오류: ${err.message || '사용자 목록을 불러오지 못했습니다.'}`))
            .finally(() => setLoading(false));
    }, [isOpen]);

    const formatDate = (ms) => {
        if (!ms) return '-';
        return new Date(ms).toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    };

    const handleDelete = async (uid, email) => {
        if (!window.confirm(`${email} 계정을 삭제하시겠습니까?`)) return;
        try {
            await adminFetch(`/api/admin/users/${uid}`, { method: 'DELETE' });
            await db.collection('users').doc(uid).delete();
            setUsers(prev => prev.filter(u => u.uid !== uid));
            setMsg(`${email} 삭제 완료`);
        } catch { setMsg('삭제 실패'); }
    };

    const handleResetPw = async (uid, email) => {
        if (!window.confirm(`${email}으로 비밀번호 초기화 링크를 발송하시겠습니까?`)) return;
        try {
            await adminFetch(`/api/admin/users/${uid}/reset-password`, { method: 'POST' });
            setMsg(`${email}로 초기화 링크 발송 완료`);
        } catch { setMsg('발송 실패'); }
    };

    const handleForceDigest = async () => {
        if (!window.confirm('모든 구독 회원에게 뉴스레터를 즉시 발송하시겠습니까?')) return;
        setDigestLoading(true);
        setMsg('');
        try {
            await adminFetch('/api/admin/digest/force', { method: 'POST' });
            setMsg('발송 시작됨 — 백그라운드에서 처리 중입니다. 결과는 Render 로그에서 확인하세요.');
        } catch (e) {
            setMsg(`발송 오류: ${e.message}`);
        } finally {
            setDigestLoading(false);
        }
    };

    if (!isOpen) return null;
    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()} style={{maxWidth:'700px', width:'95vw'}}>
                <div className="modal-header">
                    <h2 className="modal-title">관리자 — 회원 관리</h2>
                    <div style={{display:'flex', alignItems:'center', gap:'0.5rem'}}>
                        <button className="btn" onClick={handleForceDigest} disabled={digestLoading}
                            style={{fontSize:'0.78rem', padding:'0.35rem 0.75rem', background:'rgba(37,99,235,0.15)', border:'1px solid rgba(37,99,235,0.3)', display:'flex', alignItems:'center', gap:'0.3rem'}}>
                            <span className="material-symbols-outlined" style={{fontSize:'1rem'}}>send</span>
                            {digestLoading ? '발송 중...' : '강제 발송'}
                        </button>
                        <button className="close-btn" onClick={onClose}><span className="material-symbols-outlined">close</span></button>
                    </div>
                </div>
                <div className="modal-body">
                    {msg && <div style={{marginBottom:'0.75rem', fontSize:'0.85rem', color: msg.startsWith('오류') ? '#ef4444' : '#10b981'}}>{msg}</div>}
                    {loading ? <div className="spinner"></div> : (
                        <div style={{overflowX:'auto'}}>
                            <table style={{width:'100%', borderCollapse:'collapse', fontSize:'0.82rem'}}>
                                <thead>
                                    <tr style={{borderBottom:'1px solid rgba(255,255,255,0.1)', color:'var(--text-muted)'}}>
                                        <th style={{padding:'0.5rem', textAlign:'left'}}>이메일</th>
                                        <th style={{padding:'0.5rem', textAlign:'left'}}>최근 접속</th>
                                        <th style={{padding:'0.5rem', textAlign:'left'}}>가입일</th>
                                        <th style={{padding:'0.5rem', textAlign:'center'}}>관리</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {users.map(u => (
                                        <tr key={u.uid} style={{borderBottom:'1px solid rgba(255,255,255,0.05)'}}>
                                            <td style={{padding:'0.6rem 0.5rem'}}>
                                                {u.email}
                                                {u.uid === currentUid && <span style={{marginLeft:'0.4rem', fontSize:'0.7rem', color:'var(--accent-color)'}}>나</span>}
                                            </td>
                                            <td style={{padding:'0.6rem 0.5rem', color:'var(--text-muted)'}}>{formatDate(u.last_sign_in)}</td>
                                            <td style={{padding:'0.6rem 0.5rem', color:'var(--text-muted)'}}>{formatDate(u.created)}</td>
                                            <td style={{padding:'0.6rem 0.5rem', textAlign:'center'}}>
                                                <div style={{display:'flex', gap:'0.4rem', justifyContent:'center'}}>
                                                    <button className="btn" onClick={() => handleResetPw(u.uid, u.email)}
                                                        style={{fontSize:'0.72rem', padding:'0.3rem 0.6rem', background:'rgba(255,255,255,0.08)'}}>
                                                        비번초기화
                                                    </button>
                                                    {u.uid !== currentUid && (
                                                        <button className="btn" onClick={() => handleDelete(u.uid, u.email)}
                                                            style={{fontSize:'0.72rem', padding:'0.3rem 0.6rem', background:'rgba(239,68,68,0.2)', border:'none'}}>
                                                            삭제
                                                        </button>
                                                    )}
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            <div style={{marginTop:'0.75rem', fontSize:'0.75rem', color:'var(--text-muted)'}}>
                                총 {users.length}명
                            </div>
                        </div>
                    )}
                </div>
            </div>
        </div>
    );
};

const AuthModal = ({ isOpen, onClose }) => {
    const [mode, setMode] = useState('login');
    const [email, setEmail] = useState('');
    const [password, setPassword] = useState('');
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);
    const [agreeTerms, setAgreeTerms] = useState(false);
    const [agreeNewsletter, setAgreeNewsletter] = useState(false);

    useEffect(() => {
        if (!isOpen) {
            setEmail('');
            setPassword('');
            setError('');
            setMode('login');
            setAgreeTerms(false);
            setAgreeNewsletter(false);
        }
    }, [isOpen]);

    const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
            if (mode === 'login') {
                await auth.signInWithEmailAndPassword(email, password);
            } else {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await db.collection('users').doc(cred.user.uid).set({
                    email: cred.user.email,
                    consentAt: firebase.firestore.FieldValue.serverTimestamp(),
                    newsletterConsent: agreeNewsletter,
                }, { merge: true });
            }
            onClose();
        } catch (err) {
            const messages = {
                'auth/user-not-found': '등록되지 않은 이메일입니다.',
                'auth/wrong-password': '비밀번호가 올바르지 않습니다.',
                'auth/email-already-in-use': '이미 사용 중인 이메일입니다.',
                'auth/weak-password': '비밀번호는 6자 이상이어야 합니다.',

            };

    const handleGoogleSignIn = async () => {
        setError('');
        setLoading(true);
        try {
            const provider = new firebase.auth.GoogleAuthProvider();
            const result = await auth.signInWithPopup(provider);
            if (result.additionalUserInfo.isNewUser) {
                await db.collection('users').doc(result.user.uid).set({

                    consentAt: firebase.firestore.FieldValue.serverTimestamp(),
                    newsletterConsent: agreeNewsletter,

            if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
                // 사용자가 직접 닫은 경우 무시

                setError('이 도메인은 Google 로그인이 허용되지 않았습니다. 관리자에게 문의하세요.');

            } else {
                setError(`Google 로그인 실패: ${err.code || err.message}`);
            }
        } finally {
            setLoading(false);
        }
    };

    if (!isOpen) return null;

    const [loading, setLoading] = useState(false);

    useEffect(() => {
        if (!isOpen) {
            setQuery('');
            setResults([]);
        }
    }, [isOpen]);

    useEffect(() => {
        const timer = setTimeout(async () => {
            if (query.trim().length > 0) {
                setLoading(true);
                const data = await fetchSearch(query);
                setResults(data);
                setLoading(false);
            } else {
                setResults([]);
            }

        return () => clearTimeout(timer);

    return (

                    {loading ? (

                                const name = item['2. name'];
                                const currency = item['3. currency'] || 'USD';

const Week52Bar = ({ price, high, low, currency }) => {
    if (!price || !high || !low || high === low) return null;
    const pct = Math.min(100, Math.max(0, ((price - low) / (high - low)) * 100));
    const dotColor = pct >= 70 ? '#10b981' : pct <= 30 ? '#ef4444' : '#94a3b8';
    return (
        <div style={{marginTop:'0.6rem'}}>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:'0.62rem', color:'var(--text-muted)', marginBottom:'4px'}}>
                <span>{formatPrice(low, currency)}</span>
                <span>52주</span>
                <span>{formatPrice(high, currency)}</span>
            </div>
            <div style={{height:'3px', background:'rgba(255,255,255,0.1)', borderRadius:'2px', position:'relative'}}>
                <div style={{position:'absolute', left:0, width:`${pct}%`, height:'100%', background:'rgba(148,163,184,0.25)', borderRadius:'2px'}}></div>
                <div style={{position:'absolute', left:`${pct}%`, transform:'translateX(-50%) translateY(-40%)', width:'9px', height:'9px', borderRadius:'50%', background:dotColor, border:'1.5px solid var(--bg-card, #0f172a)', boxSizing:'border-box'}}></div>
            </div>
        </div>
    );
};

const FavoriteCard = ({ favorite, isActive, onClick, onToggle, quote, quotesLoading, isDragging, isDragOver, onDragStart, onDragOver, onDrop, onDragEnd }) => {

    const [scrollDelta, setScrollDelta] = useState(0);
    const [nameTapped, setNameTapped] = useState(false);

    useEffect(() => {
        const wrap = nameWrapRef.current;
        const span = wrap?.firstElementChild;
        if (!wrap || !span) return;
        const delta = span.scrollWidth - wrap.offsetWidth;
        setScrollDelta(delta > 0 ? delta + 4 : 0);
    }, [favorite.name]);

    const handleCardTouchStart = () => {
        if (!scrollDelta) return;
        setNameTapped(true);
        clearTimeout(tapTimerRef.current);
        tapTimerRef.current = setTimeout(() => setNameTapped(false), 2000);

    const rawChange = quote ? quote['09. change'] : 0;

    return (
        <div
            className={`glass-panel favorite-card ${isActive ? 'active' : ''}${isDragging ? ' dragging' : ''}${isDragOver ? ' drag-over' : ''}`}

                        checked={true}

                    <div>

                            <span className={`card-name-text${scrollDelta > 0 ? ' overflows' : ''}${nameTapped ? ' tapped' : ''}`} style={{fontWeight: 600, fontSize: '1rem'}}>{favorite.name}</span>
                        </div>
                        <div style={{fontSize: '0.72rem', color: 'var(--text-muted)', marginTop: '2px'}}>{favorite.symbol}</div>
                    </div>
                </div>
            </div>
            {loading ? (
                <div style={{height: '48px', display:'flex', alignItems:'center'}}>
                    <div className="spinner" style={{width:'20px', height:'20px', margin:0, borderWidth:'2px'}}></div>
                </div>
            ) : (
                <>
                    <div className="card-price" style={{fontSize: currency==='KRW' ? '1.2rem' : '1.5rem'}}>
                        {formatPrice(rawPrice, currency)}
                    </div>
                    <div className={`card-change ${isPositive ? 'text-success' : isNegative ? 'text-danger' : 'text-neutral'}`}>
                        <span className="material-symbols-outlined" style={{fontSize: '1rem'}}>
                            {isPositive ? 'trending_up' : isNegative ? 'trending_down' : 'remove'}
                        </span>
                        {formatPrice(rawChange, currency)} ({(changePct >= 0 ? '+' : '') + parseFloat(changePct).toFixed(2)}%)
                    </div>
                    <Week52Bar
                        price={rawPrice}
                        high={quote ? quote['12. 52w_high'] : null}
                        low={quote ? quote['13. 52w_low'] : null}
                        currency={currency}
                    />
                </>

    );

const ChartSection = ({ activeStock }) => {
    const chartRef = useRef(null);
    const chartInstance = useRef(null);
    const volChartRef = useRef(null);
    const volChartInstance = useRef(null);
    const [timeframe, setTimeframe] = useState('1M');
    const [data, setData] = useState(null);
    const [loading, setLoading] = useState(false);
    const [indicators, setIndicators] = useState({ ma5: false, ma20: false, ma60: false, bb: false, vol: false });
    const [activeTip, setActiveTip] = useState(null);
    const tipTimerRef = useRef(null);

    const toggleIndicator = (key) => {
        setIndicators(prev => ({ ...prev, [key]: !prev[key] }));
        setActiveTip(key);
        clearTimeout(tipTimerRef.current);
        tipTimerRef.current = setTimeout(() => setActiveTip(null), 1500);
    };

    useEffect(() => {
        if (!activeStock) return;
        const loadData = async () => {
            setLoading(true);
            const tsData = await fetchTimeSeries(activeStock.symbol);
            if (tsData) {
                const entries = Object.entries(tsData)
                    .map(([date, values]) => ({
                        date,
                        open: parseFloat(values['1. open']),
                        high: parseFloat(values['2. high']),
                        low: parseFloat(values['3. low']),
                        close: parseFloat(values['4. close']),
                        volume: parseInt(values['5. volume'] || 0, 10),
                    }))
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
                setData(entries);
            } else {
                setData([]);
            }
            setLoading(false);
        };
        loadData();
    }, [activeStock]);

    useEffect(() => {
        return () => {
            if (chartInstance.current) chartInstance.current.destroy();
            if (volChartInstance.current) volChartInstance.current.destroy();
        };
    }, []);

    useEffect(() => {
        if (!data || !chartRef.current) return;

        const calcMA = (values, period) => values.map((_, i) => {
            if (i < period - 1) return null;
            return values.slice(i - period + 1, i + 1).reduce((s, v) => s + v, 0) / period;
        });

        const calcBB = (values) => {
            const period = 20;
            const ma = calcMA(values, period);
            return values.map((_, i) => {
                if (i < period - 1) return { upper: null, lower: null };
                const slice = values.slice(i - period + 1, i + 1);
                const mean = ma[i];
                const std = Math.sqrt(slice.reduce((s, v) => s + (v - mean) ** 2, 0) / period);
                return { upper: mean + 2 * std, lower: mean - 2 * std };
            });
        };

        let filtered = [...data];
        const now = new Date(data[data.length - 1]?.date || Date.now());

        if (timeframe === '1W') {
            const ago = new Date(now); ago.setDate(ago.getDate() - 7);
            filtered = data.filter(d => new Date(d.date) >= ago);
        } else if (timeframe === '1M') {
            const ago = new Date(now); ago.setMonth(ago.getMonth() - 1);
            filtered = data.filter(d => new Date(d.date) >= ago);
        } else if (timeframe === '3M') {
            const ago = new Date(now); ago.setMonth(ago.getMonth() - 3);
            filtered = data.filter(d => new Date(d.date) >= ago);
        }

        const labels = filtered.map(d => d.date);
        const xs = filtered.map(d => new Date(d.date).getTime());
        const values = filtered.map(d => d.close);
        const volumes = filtered.map(d => d.volume);
        const cur = activeStock?.currency || 'USD';

        if (chartInstance.current) chartInstance.current.destroy();

        const ctx = chartRef.current.getContext('2d');

        const ohlcData = filtered.map((d, i) => ({ x: xs[i], o: d.open, h: d.high, l: d.low, c: d.close }));
        const yMin = filtered.length ? Math.min(...filtered.map(d => d.low)) : 0;
        const yMax = filtered.length ? Math.max(...filtered.map(d => d.high)) : 1;

        const candlestickPlugin = {
            id: 'candlestickDraw',
            afterDatasetsDraw(chart) {
                const { ctx: c, data, scales: { x: xSc, y: ySc } } = chart;
                const ohlc = data.datasets[0]._ohlc;
                if (!ohlc || !ohlc.length) return;
                const n = ohlc.length;
                const span = n > 1 ? xSc.getPixelForValue(ohlc[n-1].x) - xSc.getPixelForValue(ohlc[0].x) : 20;
                const barW = Math.max(1, Math.min(16, (n > 1 ? span / (n - 1) : 10) * 0.65));
                c.save();
                ohlc.forEach(d => {
                    const px = xSc.getPixelForValue(d.x);
                    const pO = ySc.getPixelForValue(d.o), pC = ySc.getPixelForValue(d.c);
                    const pH = ySc.getPixelForValue(d.h), pL = ySc.getPixelForValue(d.l);
                    const up = d.c >= d.o;
                    c.strokeStyle = up ? '#10b981' : '#ef4444';
                    c.fillStyle   = up ? 'rgba(16,185,129,0.75)' : 'rgba(239,68,68,0.75)';
                    c.lineWidth = 1;
                    c.beginPath(); c.moveTo(px, pH); c.lineTo(px, pL); c.stroke();
                    const top = Math.min(pO, pC), bh = Math.max(1, Math.abs(pO - pC));
                    c.fillRect(px - barW/2, top, barW, bh);
                    c.strokeRect(px - barW/2, top, barW, bh);
                });
                c.restore();
            }
        };

        const datasets = [{
            label: '캔들',
            type: 'line',
            data: filtered.map((d, i) => ({ x: xs[i], y: d.close })),
            _ohlc: ohlcData,
            borderColor: 'transparent',
            backgroundColor: 'transparent',
            pointRadius: 0,
            fill: false,
        }];

        if (indicators.ma5) {
            datasets.push({ label: '5일선', type: 'line', data: calcMA(values, 5).map((v, i) => ({ x: xs[i], y: v })), borderColor: '#f59e0b', borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.1 });
        }
        if (indicators.ma20) {
            datasets.push({ label: '20일선', type: 'line', data: calcMA(values, 20).map((v, i) => ({ x: xs[i], y: v })), borderColor: '#3b82f6', borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.1 });
        }
        if (indicators.ma60) {
            datasets.push({ label: '60일선', type: 'line', data: calcMA(values, 60).map((v, i) => ({ x: xs[i], y: v })), borderColor: '#a855f7', borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.1 });
        }
        if (indicators.bb) {
            const bb = calcBB(values);
            datasets.push({ label: '볼린저', type: 'line', data: bb.map((b, i) => ({ x: xs[i], y: b.upper })), borderColor: 'rgba(148,163,184,0.7)', borderWidth: 1, borderDash: [4, 3], pointRadius: 0, fill: false, tension: 0.1 });
            datasets.push({ label: '__bb_lower__', type: 'line', data: bb.map((b, i) => ({ x: xs[i], y: b.lower })), borderColor: 'rgba(148,163,184,0.7)', borderWidth: 1, borderDash: [4, 3], pointRadius: 0, fill: false, tension: 0.1 });
        }

        chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: { datasets },
            plugins: [candlestickPlugin],
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false, mode: 'index' },
                plugins: {
                    legend: {
                        display: datasets.length > 1,
                        labels: {
                            color: '#94a3b8', font: { size: 11 }, boxWidth: 20, padding: 8,
                            filter: item => item.datasetIndex !== 0 && !item.text.startsWith('__'),
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(30,41,59,0.9)',
                        titleColor: '#f8fafc',
                        bodyColor: '#f8fafc',
                        borderColor: 'rgba(255,255,255,0.1)',
                        borderWidth: 1,
                        padding: 10,
                        filter: item => item.datasetIndex === 0 || (item.parsed.y !== null && !item.dataset.label.startsWith('__')),
                        callbacks: {
                            label: ctx => {
                                if (ctx.datasetIndex === 0) {
                                    const ohlc = ctx.dataset._ohlc;
                                    if (ohlc && ohlc[ctx.dataIndex]) {
                                        const d = ohlc[ctx.dataIndex];
                                        return [
                                            `시가 ${formatTooltip(d.o, cur)}`,
                                            `고가 ${formatTooltip(d.h, cur)}`,
                                            `저가 ${formatTooltip(d.l, cur)}`,
                                            `종가 ${formatTooltip(d.c, cur)}`,

                                    }
                                }
                                return `${ctx.dataset.label}: ${formatTooltip(ctx.parsed.y, cur)}`;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'time',
                        time: { unit: timeframe === '1Y' ? 'month' : timeframe === '3M' ? 'week' : 'day' },
                        grid: { display: false, drawBorder: false },
                        ticks: { maxTicksLimit: 6, color: '#94a3b8' }

                        max: yMax * 1.002,

            const volCtx = volChartRef.current.getContext('2d');

                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: '거래량',
                        data: volumes,
                        backgroundColor: values.map((v, i) =>
                            i === 0 || v >= values[i - 1] ? 'rgba(16,185,129,0.5)' : 'rgba(239,68,68,0.5)'
                        ),
                        borderWidth: 0,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(30,41,59,0.9)',
                            titleColor: '#f8fafc',
                            bodyColor: '#f8fafc',
                            callbacks: { label: ctx => `거래량: ${ctx.parsed.y.toLocaleString()}` }
                        }
                    },
                    scales: {
                        x: { grid: { display: false, drawBorder: false }, ticks: { display: false } },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },
                            ticks: {
                                color: '#94a3b8', maxTicksLimit: 3,
                                callback: val => val >= 1e9 ? (val/1e9).toFixed(1)+'B' : val >= 1e6 ? (val/1e6).toFixed(1)+'M' : val >= 1e3 ? (val/1e3).toFixed(0)+'K' : val
                            }
                        }
                    }
                }
            });
        }

    }, [data, timeframe, indicators]);

    if (!activeStock) {
        return (
            <div className="glass-panel chart-section chart-placeholder">
                <div className="empty-state">
                    <span className="material-symbols-outlined">show_chart</span>
                    <p>종목을 선택하면 차트가 표시됩니다.</p>
                </div>
            </div>
        );
    }

    const indicatorConfig = [
        { key: 'ma5',  label: '5일선',  color: '#f59e0b', tip: '5일 이동평균선' },
        { key: 'ma20', label: '20일선', color: '#3b82f6', tip: '20일 이동평균선' },
        { key: 'ma60', label: '60일선', color: '#a855f7', tip: '60일 이동평균선' },
        { key: 'bb',   label: 'BB',   color: '#94a3b8', tip: '볼린저 밴드 — 가격 변동 범위' },
        { key: 'vol',  label: '거래량', color: '#10b981', tip: '일별 거래량' },
    ];

    return (

            <div className="chart-header">
                <div className="chart-title">{activeStock.name} ({activeStock.symbol})</div>
                <div style={{display:'flex', gap:'0.5rem', alignItems:'center', flexWrap:'wrap', justifyContent:'flex-end'}}>
                    <div className="timeframe-selector">
                        {['1W', '1M', '3M', '1Y'].map(tf => (
                            <button

const MarketOverview = () => {
    const [data, setData] = useState([]);
    const [loading, setLoading] = useState(true);
    const [updatedAt, setUpdatedAt] = useState(null);
    const [econEvents, setEconEvents] = useState([]);
    const [econIndex, setEconIndex] = useState(0);

    const load = useCallback(async () => {
        try {
            const res = await fetch(`${BASE_URL}/market`);
            const json = await res.json();
            setData(Array.isArray(json) ? json : []);
            setUpdatedAt(new Date());
        } catch (e) {
            console.error('Market API error:', e);
            setData([]);
        } finally {
            setLoading(false);
        }
    }, []);

    useEffect(() => {
        load();
        const id = setInterval(load, 5 * 60 * 1000);
        return () => clearInterval(id);
    }, [load]);

    useEffect(() => {
        fetch(`${BASE_URL}/economic-calendar?weeks=2`)
            .then(res => res.ok ? res.json() : [])
            .then(json => setEconEvents(Array.isArray(json) ? json : []))
            .catch(() => setEconEvents([]));
    }, []);

    useEffect(() => {
        if (econEvents.length <= 1) return;
        const id = setInterval(() => {
            setEconIndex(i => (i + 1) % econEvents.length);
        }, 3000);
        return () => clearInterval(id);
    }, [econEvents]);

    const fmtPrice = (item) => {
        if (item.symbol === 'KRW=X') return Math.round(item.price).toLocaleString('ko-KR') + '원';
        if (item.currency === 'KRW') return Math.round(item.price).toLocaleString('ko-KR');
        return item.price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    const fmtEventDate = (dateStr) => {
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const d = new Date(dateStr + 'T00:00:00+09:00');
        return `${dateStr.slice(5).replace('-', '.')}(${days[d.getDay()]})`;
    };

    return (
        <div className="glass-panel market-overview">
            <div className="market-overview-header">
                <h2 className="market-overview-title">
                    <span className="material-symbols-outlined">public</span>
                    시장 현황
                </h2>
                {updatedAt && (
                    <span className="market-updated">
                        {updatedAt.toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit'})} 기준
                    </span>
                )}
            </div>
            {loading ? (
                <div style={{padding:'1.1rem', display:'flex', justifyContent:'center'}}>
                    <div className="spinner" style={{width:'18px', height:'18px', margin:0, borderWidth:'2px'}}></div>
                </div>
            ) : data.length > 0 ? (
                <div className="market-ticker">
                    {data.map(item => {
                        const pos = item.change > 0;
                        const neg = item.change < 0;
                        return (
                            <div key={item.symbol} className="market-ticker-item">
                                <div className="market-ticker-name">{item.name}</div>
                                <div className="market-ticker-price">{fmtPrice(item)}</div>
                                <div className={`market-ticker-change ${pos ? 'text-success' : neg ? 'text-danger' : 'text-neutral'}`}>
                                    <span className="material-symbols-outlined" style={{fontSize:'0.9rem'}}>
                                        {pos ? 'arrow_drop_up' : neg ? 'arrow_drop_down' : 'remove'}
                                    </span>
                                    {item.change_pct >= 0 ? '+' : ''}{item.change_pct.toFixed(2)}%
                                </div>
                            </div>
                        );
                    })}
                </div>
            ) : null}
            {econEvents.length > 0 && (
                <div className="market-econ-roll">
                    <span className="material-symbols-outlined market-econ-icon">event</span>
                    <div className="market-econ-roll-window">
                        <div key={econEvents[econIndex].id} className="market-econ-roll-item">
                            <span className="market-econ-date">{fmtEventDate(econEvents[econIndex].date)}</span>
                            <span className="market-econ-name">{econEvents[econIndex].name_ko}</span>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

const ContactModal = ({ isOpen, onClose }) => {
    const [form, setForm] = useState({ name: '', email: '', subject: '', message: '' });
    const [status, setStatus] = useState('idle'); // idle | loading | success | error
    const [errorMsg, setErrorMsg] = useState('');

    useEffect(() => {
        if (!isOpen) {
            setForm({ name: '', email: '', subject: '', message: '' });
            setStatus('idle');
            setErrorMsg('');
        }
    }, [isOpen]);

    const handleChange = (e) => setForm(prev => ({ ...prev, [e.target.name]: e.target.value }));

    const handleSubmit = async (e) => {
        e.preventDefault();
        setStatus('loading');
        setErrorMsg('');
        try {
            const res = await fetch(`${BASE_URL}/contact`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(form),
            });
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.detail || '발송에 실패했습니다.');
            }
            setStatus('success');
        } catch (err) {
            setErrorMsg(err.message);
            setStatus('error');
        }
    };

    if (!isOpen) return null;

    const inputStyle = {
        width: '100%', padding: '0.6rem 0.75rem', background: 'rgba(255,255,255,0.05)',
        border: '1px solid rgba(255,255,255,0.1)', borderRadius: '8px',
        color: 'var(--text-primary)', fontSize: '0.9rem', outline: 'none', boxSizing: 'border-box',
    };

    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()} style={{maxWidth: '480px'}}>
                <div className="modal-header">
                    <h2 className="modal-title">관리자에게 문의하기</h2>
                    <button className="close-btn" onClick={onClose}>
                        <span className="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div className="modal-body">
                    {status === 'success' ? (
                        <div style={{textAlign:'center', padding:'2rem 0'}}>
                            <span className="material-symbols-outlined" style={{fontSize:'2.5rem', color:'#4ade80', display:'block', marginBottom:'0.75rem'}}>check_circle</span>
                            <p style={{color:'var(--text-primary)', fontSize:'1rem', marginBottom:'0.5rem'}}>문의가 전송되었습니다.</p>
                            <p style={{color:'var(--text-muted)', fontSize:'0.85rem'}}>빠른 시일 내에 답변 드리겠습니다.</p>
                            <button className="btn-primary" style={{marginTop:'1.5rem'}} onClick={onClose}>닫기</button>
                        </div>
                    ) : (
                        <form onSubmit={handleSubmit} style={{display:'flex', flexDirection:'column', gap:'0.75rem'}}>
                            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0.75rem'}}>
                                <div>
                                    <label style={{fontSize:'0.75rem', color:'var(--text-muted)', display:'block', marginBottom:'0.3rem'}}>이름 *</label>
                                    <input name="name" value={form.name} onChange={handleChange} required style={inputStyle} placeholder="홍길동" />
                                </div>
                                <div>
                                    <label style={{fontSize:'0.75rem', color:'var(--text-muted)', display:'block', marginBottom:'0.3rem'}}>이메일 *</label>
                                    <input name="email" type="email" value={form.email} onChange={handleChange} required style={inputStyle} placeholder="example@email.com" />
                                </div>
                            </div>
                            <div>
                                <label style={{fontSize:'0.75rem', color:'var(--text-muted)', display:'block', marginBottom:'0.3rem'}}>제목 *</label>
                                <input name="subject" value={form.subject} onChange={handleChange} required style={inputStyle} placeholder="문의 제목을 입력해주세요" />
                            </div>
                            <div>
                                <label style={{fontSize:'0.75rem', color:'var(--text-muted)', display:'block', marginBottom:'0.3rem'}}>내용 * (최대 2000자)</label>
                                <textarea name="message" value={form.message} onChange={handleChange} required rows={6}
                                    style={{...inputStyle, resize:'vertical', lineHeight:'1.6'}}
                                    placeholder="문의 내용을 입력해주세요" maxLength={2000} />
                                <div style={{textAlign:'right', fontSize:'0.72rem', color:'var(--text-muted)', marginTop:'0.25rem'}}>{form.message.length}/2000</div>
                            </div>
                            {status === 'error' && (
                                <div style={{color:'#ef4444', fontSize:'0.85rem', padding:'0.5rem 0.75rem', background:'rgba(239,68,68,0.1)', borderRadius:'6px'}}>
                                    {errorMsg}
                                </div>
                            )}
                            <button type="submit" className="btn-primary" disabled={status === 'loading'}
                                style={{display:'flex', alignItems:'center', justifyContent:'center', gap:'0.5rem'}}>
                                {status === 'loading' ? (
                                    <><div className="spinner" style={{width:'14px', height:'14px', borderWidth:'2px'}}></div>전송 중...</>
                                ) : '문의 보내기'}
                            </button>
                        </form>
                    )}
                </div>
            </div>
        </div>
    );
};

            if (doc.exists && doc.data().favorites) {
                const favs = doc.data().favorites;
                setFavorites(favs);
                if (favs.length > 0) setActiveStock(favs[0]);
            }
            firestoreReady.current = true;
        });
        user.getIdToken().then(token =>
            fetch(`${BASE_URL.replace('/api','')}/api/admin/check`, { headers: { Authorization: `Bearer ${token}` } })
        ).then(r => r.json()).then(d => setIsAdmin(d.is_admin)).catch(() => {});
    }, [user]);

    useEffect(() => {
        if (!user || !firestoreReady.current) return;
        db.collection('users').doc(user.uid).set({ favorites }, { merge: true });
    }, [favorites, user]);

    useEffect(() => {
        if (favorites.length === 0) { setQuotes({}); return; }
        setQuotesLoading(true);
        fetchQuotes(favorites.map(f => f.symbol)).then(data => {
            setQuotes(data || {});
            setQuotesLoading(false);
        });
    }, [favorites.map(f => f.symbol).join(',')]);

    const toggleFavorite = (stock) => {
        setFavorites(prev => {
            const exists = prev.some(f => f.symbol === stock.symbol);
            if (exists) {
                const newFavs = prev.filter(f => f.symbol !== stock.symbol);
                if (activeStock?.symbol === stock.symbol) {
                    setActiveStock(newFavs.length > 0 ? newFavs[0] : null);
                }
                return newFavs;
            } else {
                if (prev.length >= 7) {
                    setFavLimitMsg(true);
                    setTimeout(() => setFavLimitMsg(false), 3000);
                    return prev;
                }
                if (prev.length === 0) setActiveStock(stock);
                return [...prev, stock];
            }
        });
    };

    const [dragIndex, setDragIndex] = useState(null);
    const [dragOverIndex, setDragOverIndex] = useState(null);

    const handleCardDragStart = (index) => setDragIndex(index);

    const handleCardDragOver = (e, index) => {
        e.preventDefault();
        if (index !== dragOverIndex) setDragOverIndex(index);
    };

    const handleCardDrop = (e, index) => {
        e.preventDefault();
        setDragIndex(currentDragIndex => {
            if (currentDragIndex !== null && currentDragIndex !== index) {
                setFavorites(prev => {
                    const next = [...prev];
                    const [moved] = next.splice(currentDragIndex, 1);
                    next.splice(index, 0, moved);
                    return next;
                });
            }
            return null;
        });
        setDragOverIndex(null);
    };

    const handleCardDragEnd = () => {
        setDragIndex(null);
        setDragOverIndex(null);
    };

    const handleLogout = () => auth.signOut();

    if (authLoading) {
        return (
            <div style={{display:'flex', alignItems:'center', justifyContent:'center', height:'100vh'}}>
                <div className="spinner"></div>
            </div>
        );
    }

    return (
        <div className="container">
            <header className="header">
                <h1>
                    <span className="material-symbols-outlined" style={{fontSize: '2.5rem', color: 'var(--accent-color)'}}>monitoring</span>
                    MarketPulse
                </h1>
                <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                    {user ? (
                        <>
                            <span style={{fontSize:'0.8rem', color:'var(--text-muted)'}}>{user.email}</span>
                            {isAdmin && (
                                <button className="btn btn-admin" onClick={() => setIsAdminOpen(true)}
                                    style={{background:'rgba(251,191,36,0.15)', border:'1px solid rgba(251,191,36,0.3)'}}>
                                    <span className="material-symbols-outlined">admin_panel_settings</span>
                                    관리자
                                </button>
                            )}
                            <button className="btn" onClick={() => setIsSearchOpen(true)}>
                                <span className="material-symbols-outlined">star</span>
                                종목 검색
                            </button>
                            <button className="btn" onClick={() => setIsProfileOpen(true)}
                                style={{background:'transparent', border:'1px solid rgba(255,255,255,0.15)'}}>
                                <span className="material-symbols-outlined">manage_accounts</span>
                                <span className="mobile-btn-label">설정</span>
                            </button>
                            <button className="btn" onClick={handleLogout}
                                style={{background:'transparent', border:'1px solid rgba(255,255,255,0.15)'}}>
                                <span className="material-symbols-outlined">logout</span>
                                <span className="mobile-btn-label">나가기</span>
                            </button>
                        </>
                    ) : (
                        <button className="btn" onClick={() => setIsAuthOpen(true)}>
                            <span className="material-symbols-outlined">login</span>
                            로그인
                        </button>
                    )}
                </div>
            </header>

            <MarketOverview />

            {!user ? (
                <div className="landing-page">
                    <div className="landing-hero glass-panel">
                        <div className="landing-badge">
                            <span className="material-symbols-outlined">auto_awesome</span>
                            매일 아침 AI 주식 브리핑
                        </div>
                        <h1 className="landing-title">MarketPulse</h1>
                        <p className="landing-tagline">내가 고른 종목만, AI가 매일 아침 정리해드립니다</p>
                        <p className="landing-subtitle">
                            시세·뉴스·투자 의견을 직접 찾아다니지 마세요. 이메일 한 통이면 끝.
                        </p>
                        <div className="landing-actions">
                            <button className="btn landing-cta-btn" onClick={() => setIsAuthOpen(true)}>
                                <span className="material-symbols-outlined">rocket_launch</span>
                                무료로 시작하기
                            </button>
                            <button className="btn landing-login-btn" onClick={() => setIsAuthOpen(true)}>
                                <span className="material-symbols-outlined">login</span>
                                로그인
                            </button>
                        </div>
                    </div>
                    <div className="landing-sample">
                        <h2 className="landing-sample-title">매일 이런 브리핑이 메일함에 도착합니다</h2>
                        <div className="sample-newsletter-card glass-panel">
                            <span className="sample-badge">샘플</span>
                            <div className="sample-stock-head">
                                <span className="sample-stock-name">삼성전자 <span className="sample-stock-code">005930.KS</span></span>
                                <span className="sample-stock-price">75,400원 <span className="sample-stock-change">▲ 1.2%</span></span>
                            </div>
                            <div className="sample-block">
                                <span className="sample-block-label">AI 투자의견</span>
                                <p className="sample-block-text">반도체 업황 회복 기대감이 지속되며 단기 상승 모멘텀이 유효합니다. HBM 수주 확대 소식이 긍정적으로 작용할 전망입니다.</p>
                            </div>
                            <div className="sample-block">
                                <span className="sample-block-label">관련 뉴스</span>
                                <ul className="sample-news-list">
                                    <li>삼성전자, HBM4 양산 일정 앞당긴다</li>
                                    <li>반도체 수출 3개월 연속 증가</li>
                                </ul>
                            </div>
                        </div>
                        <p className="landing-trust-bar">Gemini 2.5 기반 AI 분석 · 매일 정해진 시간 자동 발송</p>
                    </div>
                    <div className="landing-features">
                        {[
                            { icon: 'monitoring', title: '아침 종목 브리핑', desc: '장 열리기 전, 오늘 봐야 할 종목 요약이 메일함에 와있다' },
                            { icon: 'candlestick_chart', title: '기술 지표 차트', desc: 'MA, 볼린저밴드까지 — 따로 찾을 필요 없다' },
                            { icon: 'smart_toy', title: '관심 종목 뉴스', desc: '관심 종목 뉴스만 골라서, 찾는 시간을 아껴준다' },
                            { icon: 'mark_email_read', title: '원하는 시간·종목', desc: '받고 싶은 시간에, 원하는 종목만' },
                        ].map(f => (
                            <div key={f.icon} className="landing-feature-card glass-panel">
                                <div className="landing-feature-icon">
                                    <span className="material-symbols-outlined">{f.icon}</span>
                                </div>
                                <h3 className="landing-feature-title">{f.title}</h3>
                                <p className="landing-feature-desc">{f.desc}</p>
                            </div>
                        ))}
                    </div>
                    <div className="landing-bottom-cta glass-panel">
                        <p className="landing-bottom-cta-text">지금 가입하면 내일 아침부터 바로 받아보실 수 있어요</p>
                        <button className="btn landing-cta-btn" onClick={() => setIsAuthOpen(true)}>
                            <span className="material-symbols-outlined">rocket_launch</span>
                            무료로 시작하기
                        </button>
                    </div>
                </div>
            ) : (
                <>
                    {favorites.length === 0 ? (
                        <div className="glass-panel fav-onboarding">
                            <p className="fav-onboarding-msg">관심 종목을 추가해보세요</p>
                            <button className="btn" onClick={() => setIsSearchOpen(true)}>
                                <span className="material-symbols-outlined" style={{fontSize:'1rem'}}>add</span>
                                종목 추가
                            </button>
                        </div>
                    ) : (
                        <div className="favorites-container">
                            {Array.from({length: 7}, (_, i) => {
                                const fav = favorites[i];
                                return fav ? (
                                    <FavoriteCard
                                        key={fav.symbol}
                                        favorite={fav}
                                        isActive={activeStock?.symbol === fav.symbol}
                                        onClick={setActiveStock}
                                        onToggle={toggleFavorite}
                                        quote={quotes[fav.symbol] || null}
                                        quotesLoading={quotesLoading}
                                        isDragging={dragIndex === i}
                                        isDragOver={dragOverIndex === i && dragIndex !== i}
                                        onDragStart={() => handleCardDragStart(i)}
                                        onDragOver={(e) => handleCardDragOver(e, i)}
                                        onDrop={(e) => handleCardDrop(e, i)}
                                        onDragEnd={handleCardDragEnd}
                                    />
                                ) : (
                                    <div key={`empty-${i}`} className="glass-panel favorite-card-empty" onClick={() => setIsSearchOpen(true)}>
                                        <span className="material-symbols-outlined" style={{fontSize:'1.6rem', color:'var(--text-muted)', opacity:0.35}}>add</span>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </>
            )}

            {favLimitMsg && (
                <div style={{padding:'0.65rem 1rem', background:'rgba(239,68,68,0.15)', border:'1px solid rgba(239,68,68,0.3)', borderRadius:'8px', color:'#ef4444', fontSize:'0.85rem', marginBottom:'1rem'}}>
                    즐겨찾기는 최대 7개까지만 추가할 수 있습니다.
                </div>
            )}
            <div className="main-grid">
                <ChartSection activeStock={activeStock} />
                <NewsSection activeStock={activeStock} />
            </div>

            <Footer onContactClick={() => setIsContactOpen(true)} />

            <AuthModal
                isOpen={isAuthOpen}
                onClose={() => setIsAuthOpen(false)}
            />
            <ProfileModal
                isOpen={isProfileOpen}
                onClose={() => setIsProfileOpen(false)}
                user={user}
            />
            <AdminModal
                isOpen={isAdminOpen}
                onClose={() => setIsAdminOpen(false)}
                currentUid={user?.uid}
            />
            <SearchModal
                isOpen={isSearchOpen}
                onClose={() => setIsSearchOpen(false)}
                favorites={favorites}
                toggleFavorite={toggleFavorite}
            />
            <ContactModal
                isOpen={isContactOpen}
                onClose={() => setIsContactOpen(false)}
            />
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
