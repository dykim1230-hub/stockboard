    <div id="root"></div>

    <!-- Firebase Init -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBtBqfY7t5xeMHgx1E3BMuW16H1TUvOIg4",
            authDomain: "portfolio-4ffcf.firebaseapp.com",
            projectId: "portfolio-4ffcf",
            storageBucket: "portfolio-4ffcf.firebasestorage.app",
            messagingSenderId: "399133068539",
            appId: "1:399133068539:web:73615f30a6017f8e0c345e"
        };
        firebase.initializeApp(firebaseConfig);

    <!-- Application Script -->
    <script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// Configuration
const BASE_URL = 'https://stockboard-fhh4.onrender.com/api';

// --- API Utilities ---
const fetchSearch = async (query) => {
    if (!query) return [];
    try {
        const res = await fetch(`${BASE_URL}/search?q=${query}`);
        const data = await res.json();
        return data || [];
    } catch (e) {
        console.error("Search API Error:", e);
        return [];
    }
};

const fetchQuote = async (symbol) => {
    try {
        const res = await fetch(`${BASE_URL}/quote?symbol=${symbol}`);
        const data = await res.json();
        return data || null;
    } catch (e) {
        console.error("Quote API Error:", e);
        return null;
    }
};

const fetchTimeSeries = async (symbol) => {
    try {
        const res = await fetch(`${BASE_URL}/chart?symbol=${symbol}`);
        const data = await res.json();
        return data || null;
    } catch (e) {
        console.error("Time Series API Error:", e);
        return null;
    }
};

const fetchNews = async (stockName, symbol, isKorean) => {
    try {
        const params = new URLSearchParams({
            stock_name: stockName,
            is_korean: isKorean ? 'true' : 'false',
        });
        if (symbol) params.append('symbol', symbol);
        const res = await fetch(`${BASE_URL}/news?${params.toString()}`);
        const data = await res.json();
        return data || [];
    } catch (e) {
        console.error("News API Error:", e);
        return [];
    }
};

// --- Formatting Helpers ---
const formatPrice = (price, currency) => {
    if (price === null || price === undefined) return '---';
    if (currency === 'KRW') {
        return Math.round(price).toLocaleString('ko-KR') + '원';
    }
    return '$' + parseFloat(price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

const formatChange = (change, currency) => {
    if (change === null || change === undefined) return '---';
    const prefix = change > 0 ? '+' : '';
    if (currency === 'KRW') {
        return prefix + Math.round(change).toLocaleString('ko-KR') + '원';
    }
    return prefix + '$' + Math.abs(parseFloat(change)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) * Math.sign(change > 0 ? 1 : -1);
};

const formatChartTick = (val, currency) => {
    if (currency === 'KRW') {
        return Math.round(val).toLocaleString('ko-KR');
    }
    return '$' + val.toFixed(2);
};

const formatTooltip = (val, currency) => {
    if (currency === 'KRW') {
        return Math.round(val).toLocaleString('ko-KR') + '원';
    }
    return '$' + val.toFixed(2);
};

// --- Admin API helpers ---
const adminFetch = async (path, options = {}) => {
    const token = await auth.currentUser.getIdToken();
    const res = await fetch(`${BASE_URL.replace('/api', '')}${path}`, {
        ...options,
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(options.headers || {}) }
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
};

// --- Components ---

const ProfileModal = ({ isOpen, onClose, user }) => {
    const [tab, setTab] = useState('password');
    const [curPw, setCurPw] = useState('');
    const [newPw, setNewPw] = useState('');
    const [confirmPw, setConfirmPw] = useState('');
    const [error, setError] = useState('');
    const [success, setSuccess] = useState('');
    const [loading, setLoading] = useState(false);

    useEffect(() => {
        if (!isOpen) { setCurPw(''); setNewPw(''); setConfirmPw(''); setError(''); setSuccess(''); setTab('password'); }
    }, [isOpen]);

    const reauth = async (password) => {
        const credential = firebase.auth.EmailAuthProvider.credential(user.email, password);
        await auth.currentUser.reauthenticateWithCredential(credential);
    };

    const handlePasswordChange = async (e) => {
        e.preventDefault();
        if (newPw !== confirmPw) { setError('새 비밀번호가 일치하지 않습니다.'); return; }
        if (newPw.length < 6) { setError('비밀번호는 6자 이상이어야 합니다.'); return; }
        setError(''); setLoading(true);
        try {
            await reauth(curPw);
            await auth.currentUser.updatePassword(newPw);
            setSuccess('비밀번호가 변경되었습니다.');
            setCurPw(''); setNewPw(''); setConfirmPw('');
        } catch (err) {
            const msgs = { 'auth/wrong-password': '현재 비밀번호가 올바르지 않습니다.', 'auth/invalid-credential': '현재 비밀번호가 올바르지 않습니다.' };
            setError(msgs[err.code] || '오류가 발생했습니다.');
        } finally { setLoading(false); }
    };

    const handleWithdraw = async (e) => {
        e.preventDefault();
        if (!window.confirm('정말 탈퇴하시겠습니까? 모든 데이터가 삭제됩니다.')) return;
        setError(''); setLoading(true);
        try {
            await reauth(curPw);
            await db.collection('users').doc(user.uid).delete();
            await auth.currentUser.delete();
            onClose();
        } catch (err) {
            const msgs = { 'auth/wrong-password': '비밀번호가 올바르지 않습니다.', 'auth/invalid-credential': '비밀번호가 올바르지 않습니다.' };
            setError(msgs[err.code] || '오류가 발생했습니다.');
        } finally { setLoading(false); }
    };

    if (!isOpen || !user) return null;
    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()} style={{maxWidth:'420px'}}>
                <div className="modal-header">
                    <h2 className="modal-title">내 계정</h2>
                    <button className="close-btn" onClick={onClose}><span className="material-symbols-outlined">close</span></button>
                </div>
                <div className="modal-body">
                    <div style={{fontSize:'0.82rem', color:'var(--text-muted)', marginBottom:'1rem'}}>{user.email}</div>
                    <div style={{display:'flex', gap:'0.5rem', marginBottom:'1.25rem'}}>
                        {['password','withdraw'].map(t => (
                            <button key={t} onClick={() => { setTab(t); setError(''); setSuccess(''); }}
                                className="timeframe-btn" style={{flex:1, padding:'0.5rem', ...(tab===t ? {background:'var(--accent-color)', color:'#fff'} : {})}}>
                                {t === 'password' ? '비밀번호 변경' : '회원 탈퇴'}
                            </button>
                        ))}
                    </div>

                    {tab === 'password' && (
                        <form onSubmit={handlePasswordChange} style={{display:'flex', flexDirection:'column', gap:'0.75rem'}}>
                            {[['현재 비밀번호', curPw, setCurPw], ['새 비밀번호', newPw, setNewPw], ['새 비밀번호 확인', confirmPw, setConfirmPw]].map(([label, val, set]) => (
                                <div key={label} className="search-input-wrapper">
                                    <span className="material-symbols-outlined">lock</span>
                                    <input type="password" className="search-input" placeholder={label} value={val} onChange={e => set(e.target.value)} required />
                                </div>
                            ))}
                            {error && <div style={{color:'#ef4444', fontSize:'0.85rem'}}>{error}</div>}
                            {success && <div style={{color:'#10b981', fontSize:'0.85rem'}}>{success}</div>}
                            <button type="submit" className="btn" disabled={loading} style={{justifyContent:'center'}}>
                                {loading ? '처리 중...' : '변경'}
                            </button>
                        </form>
                    )}

                    {tab === 'withdraw' && (
                        <form onSubmit={handleWithdraw} style={{display:'flex', flexDirection:'column', gap:'0.75rem'}}>
                            <div style={{color:'#ef4444', fontSize:'0.85rem', padding:'0.75rem', background:'rgba(239,68,68,0.1)', borderRadius:'6px'}}>
                                탈퇴 시 즐겨찾기 등 모든 데이터가 영구 삭제됩니다.
                            </div>
                            <div className="search-input-wrapper">
                                <span className="material-symbols-outlined">lock</span>
                                <input type="password" className="search-input" placeholder="비밀번호 확인" value={curPw} onChange={e => setCurPw(e.target.value)} required />
                            </div>
                            {error && <div style={{color:'#ef4444', fontSize:'0.85rem'}}>{error}</div>}
                            <button type="submit" className="btn" disabled={loading}
                                style={{justifyContent:'center', background:'#ef4444', border:'none'}}>
                                {loading ? '처리 중...' : '탈퇴하기'}
                            </button>
                        </form>
                    )}
                </div>
            </div>
        </div>
    );
};

const AdminModal = ({ isOpen, onClose, currentUid }) => {
    const [users, setUsers] = useState([]);
    const [loading, setLoading] = useState(false);
    const [msg, setMsg] = useState('');

    useEffect(() => {
        if (!isOpen) { setMsg(''); return; }
        setLoading(true);
        adminFetch('/api/admin/users')
            .then(data => setUsers(data))
            .catch(() => setMsg('사용자 목록을 불러오지 못했습니다.'))
            .finally(() => setLoading(false));
    }, [isOpen]);

    const formatDate = (ms) => {
        if (!ms) return '-';
        return new Date(ms).toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    };

    const handleDelete = async (uid, email) => {
        if (!window.confirm(`${email} 계정을 삭제하시겠습니까?`)) return;
        try {
            await adminFetch(`/api/admin/users/${uid}`, { method: 'DELETE' });
            await db.collection('users').doc(uid).delete();
            setUsers(prev => prev.filter(u => u.uid !== uid));
            setMsg(`${email} 삭제 완료`);
        } catch { setMsg('삭제 실패'); }
    };

    const handleResetPw = async (uid, email) => {
        if (!window.confirm(`${email}으로 비밀번호 초기화 링크를 발송하시겠습니까?`)) return;
        try {
            await adminFetch(`/api/admin/users/${uid}/reset-password`, { method: 'POST' });
            setMsg(`${email}로 초기화 링크 발송 완료`);
        } catch { setMsg('발송 실패'); }
    };

    if (!isOpen) return null;
    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()} style={{maxWidth:'700px', width:'95vw'}}>
                <div className="modal-header">
                    <h2 className="modal-title">관리자 — 회원 관리</h2>
                    <button className="close-btn" onClick={onClose}><span className="material-symbols-outlined">close</span></button>
                </div>
                <div className="modal-body">
                    {msg && <div style={{marginBottom:'0.75rem', fontSize:'0.85rem', color:'#10b981'}}>{msg}</div>}
                    {loading ? <div className="spinner"></div> : (
                        <div style={{overflowX:'auto'}}>
                            <table style={{width:'100%', borderCollapse:'collapse', fontSize:'0.82rem'}}>
                                <thead>
                                    <tr style={{borderBottom:'1px solid rgba(255,255,255,0.1)', color:'var(--text-muted)'}}>
                                        <th style={{padding:'0.5rem', textAlign:'left'}}>이메일</th>
                                        <th style={{padding:'0.5rem', textAlign:'left'}}>최근 접속</th>
                                        <th style={{padding:'0.5rem', textAlign:'left'}}>가입일</th>
                                        <th style={{padding:'0.5rem', textAlign:'center'}}>관리</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {users.map(u => (
                                        <tr key={u.uid} style={{borderBottom:'1px solid rgba(255,255,255,0.05)'}}>
                                            <td style={{padding:'0.6rem 0.5rem'}}>
                                                {u.email}
                                                {u.uid === currentUid && <span style={{marginLeft:'0.4rem', fontSize:'0.7rem', color:'var(--accent-color)'}}>나</span>}
                                            </td>
                                            <td style={{padding:'0.6rem 0.5rem', color:'var(--text-muted)'}}>{formatDate(u.last_sign_in)}</td>
                                            <td style={{padding:'0.6rem 0.5rem', color:'var(--text-muted)'}}>{formatDate(u.created)}</td>
                                            <td style={{padding:'0.6rem 0.5rem', textAlign:'center'}}>
                                                <div style={{display:'flex', gap:'0.4rem', justifyContent:'center'}}>
                                                    <button className="btn" onClick={() => handleResetPw(u.uid, u.email)}
                                                        style={{fontSize:'0.72rem', padding:'0.3rem 0.6rem', background:'rgba(255,255,255,0.08)'}}>
                                                        비번초기화
                                                    </button>
                                                    {u.uid !== currentUid && (
                                                        <button className="btn" onClick={() => handleDelete(u.uid, u.email)}
                                                            style={{fontSize:'0.72rem', padding:'0.3rem 0.6rem', background:'rgba(239,68,68,0.2)', border:'none'}}>
                                                            삭제
                                                        </button>
                                                    )}
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            <div style={{marginTop:'0.75rem', fontSize:'0.75rem', color:'var(--text-muted)'}}>
                                총 {users.length}명
                            </div>
                        </div>
                    )}
                </div>
            </div>
        </div>
    );
};

const AuthModal = ({ isOpen, onClose }) => {
    const [mode, setMode] = useState('login');
    const [email, setEmail] = useState('');
    const [password, setPassword] = useState('');
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);

    useEffect(() => {
        if (!isOpen) {
            setEmail('');
            setPassword('');
            setError('');
            setMode('login');
        }
    }, [isOpen]);

    const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
            if (mode === 'login') {
                await auth.signInWithEmailAndPassword(email, password);
            } else {
                await auth.createUserWithEmailAndPassword(email, password);
            }
            onClose();
        } catch (err) {
            const messages = {
                'auth/user-not-found': '등록되지 않은 이메일입니다.',
                'auth/wrong-password': '비밀번호가 올바르지 않습니다.',
                'auth/email-already-in-use': '이미 사용 중인 이메일입니다.',
                'auth/weak-password': '비밀번호는 6자 이상이어야 합니다.',
                'auth/invalid-email': '올바르지 않은 이메일 형식입니다.',
                'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않습니다.',
            };
            setError(messages[err.code] || '오류가 발생했습니다. 다시 시도해주세요.');
        } finally {
            setLoading(false);
        }
    };

    if (!isOpen) return null;

    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()} style={{maxWidth: '400px'}}>
                <div className="modal-header">
                    <h2 className="modal-title">{mode === 'login' ? '로그인' : '회원가입'}</h2>
                    <button className="close-btn" onClick={onClose}>
                        <span className="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div className="modal-body">
                    <form onSubmit={handleSubmit} style={{display:'flex', flexDirection:'column', gap:'1rem'}}>
                        <div className="search-input-wrapper">
                            <span className="material-symbols-outlined">mail</span>
                            <input
                                type="email"
                                className="search-input"
                                placeholder="이메일"
                                value={email}
                                onChange={e => setEmail(e.target.value)}
                                required
                                autoFocus
                            />
                        </div>
                        <div className="search-input-wrapper">
                            <span className="material-symbols-outlined">lock</span>
                            <input
                                type="password"
                                className="search-input"
                                placeholder="비밀번호 (6자 이상)"
                                value={password}
                                onChange={e => setPassword(e.target.value)}
                                required
                            />
                        </div>
                        {error && (
                            <div style={{color:'#ef4444', fontSize:'0.85rem', padding:'0.5rem', background:'rgba(239,68,68,0.1)', borderRadius:'6px'}}>
                                {error}
                            </div>
                        )}
                        <button type="submit" className="btn" disabled={loading} style={{width:'100%', justifyContent:'center', padding:'0.75rem'}}>
                            {loading ? '처리 중...' : (mode === 'login' ? '로그인' : '회원가입')}
                        </button>
                    </form>
                    <div style={{textAlign:'center', marginTop:'1.25rem', fontSize:'0.85rem', color:'var(--text-muted)'}}>
                        {mode === 'login' ? (
                            <>계정이 없으신가요?{' '}
                                <span style={{color:'var(--accent-color)', cursor:'pointer'}} onClick={() => { setMode('signup'); setError(''); }}>
                                    회원가입
                                </span>
                            </>
                        ) : (
                            <>이미 계정이 있으신가요?{' '}
                                <span style={{color:'var(--accent-color)', cursor:'pointer'}} onClick={() => { setMode('login'); setError(''); }}>
                                    로그인
                                </span>
                            </>
                        )}
                    </div>
                </div>
            </div>
        </div>
    );
};

const SearchModal = ({ isOpen, onClose, favorites, toggleFavorite }) => {
    const [query, setQuery] = useState('');
    const [results, setResults] = useState([]);
    const [loading, setLoading] = useState(false);

    useEffect(() => {
        if (!isOpen) {
            setQuery('');
            setResults([]);
        }
    }, [isOpen]);

    useEffect(() => {
        const timer = setTimeout(async () => {
            if (query.trim().length > 0) {
                setLoading(true);
                const data = await fetchSearch(query);
                setResults(data);
                setLoading(false);
            } else {
                setResults([]);
            }
        }, 500);
        return () => clearTimeout(timer);
    }, [query]);

    if (!isOpen) return null;

    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                    <h2 className="modal-title">종목 검색</h2>
                    <button className="close-btn" onClick={onClose}>
                        <span className="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div className="modal-body">
                    <div className="search-input-wrapper">
                        <span className="material-symbols-outlined">search</span>
                        <input 
                            type="text" 
                            className="search-input" 
                            placeholder="종목명 또는 티커(Ticker) 검색..." 
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                            autoFocus
                        />
                    </div>
                    
                    {loading ? (
                        <div className="spinner"></div>
                    ) : (
                        <div className="search-results">
                            {results.map((item) => {
                                const symbol = item['1. symbol'];
                                const name = item['2. name'];
                                const currency = item['3. currency'] || 'USD';
                                const isChecked = favorites.some(f => f.symbol === symbol);
                                
                                const isKorean = item['4. is_korean'] === true;
                                return (
                                    <div key={symbol} className="search-result-item" onClick={() => toggleFavorite({symbol, name, currency, isKorean})}>
                                        <input
                                            type="checkbox"
                                            className="custom-checkbox"
                                            checked={isChecked}
                                            readOnly
                                        />
                                        <div className="search-result-info">
                                            <div className="search-result-symbol">
                                                {name}
                                                <span style={{fontSize:'0.75rem', color:'var(--text-muted)', marginLeft:'0.5rem'}}>({symbol})</span>
                                            </div>
                                            <div className="search-result-name" style={{color: currency==='KRW' ? '#10b981' : '#3b82f6'}}>
                                                {currency === 'KRW' ? '🇰🇷 국내' : '🌐 해외'}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                            {!loading && query && results.length === 0 && (
                                <div className="empty-state">검색 결과가 없습니다.</div>
                            )}
                        </div>
                    )}
                </div>
            </div>
        </div>
    );
};

const FavoriteCard = ({ favorite, isActive, onClick, onToggle }) => {
    const [quote, setQuote] = useState(null);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        const loadQuote = async () => {
            setLoading(true);
            const data = await fetchQuote(favorite.symbol);
            if (data && data['05. price'] !== undefined) {
                setQuote(data);
            }
            setLoading(false);
        };
        loadQuote();
    }, [favorite.symbol]);

    const currency = quote ? (quote['11. currency'] || favorite.currency || 'USD') : (favorite.currency || 'USD');
    const rawPrice = quote ? quote['05. price'] : null;
    const rawChange = quote ? quote['09. change'] : 0;
    const changePct = quote ? quote['10. change percent'] : 0;
    const isPositive = rawChange > 0;
    const isNegative = rawChange < 0;

    return (
        <div className={`glass-panel favorite-card ${isActive ? 'active' : ''}`} onClick={() => onClick(favorite)}>
            <div className="card-header">
                <div className="card-symbol" onClick={e => e.stopPropagation()}>
                    <input 
                        type="checkbox" 
                        className="custom-checkbox"
                        checked={true}
                        onChange={() => onToggle(favorite)}
                    />
                    <div>
                        <div style={{fontWeight: 600, fontSize: '1rem'}}>{favorite.name}</div>
                        <div style={{fontSize: '0.72rem', color: 'var(--text-muted)', marginTop: '2px'}}>{favorite.symbol}</div>
                    </div>
                </div>
            </div>
            {loading ? (
                <div style={{height: '48px', display:'flex', alignItems:'center'}}>
                    <div className="spinner" style={{width:'20px', height:'20px', margin:0, borderWidth:'2px'}}></div>
                </div>
            ) : (
                <>
                    <div className="card-price" style={{fontSize: currency==='KRW' ? '1.2rem' : '1.5rem'}}>
                        {formatPrice(rawPrice, currency)}
                    </div>
                    <div className={`card-change ${isPositive ? 'text-success' : isNegative ? 'text-danger' : 'text-neutral'}`}>
                        <span className="material-symbols-outlined" style={{fontSize: '1rem'}}>
                            {isPositive ? 'trending_up' : isNegative ? 'trending_down' : 'remove'}
                        </span>
                        {formatPrice(rawChange, currency)} ({(changePct >= 0 ? '+' : '') + parseFloat(changePct).toFixed(2)}%)
                    </div>
                </>
            )}
        </div>
    );
};

const ChartSection = ({ activeStock }) => {
    const chartRef = useRef(null);
    const chartInstance = useRef(null);
    const [timeframe, setTimeframe] = useState('1M');
    const [data, setData] = useState(null);
    const [loading, setLoading] = useState(false);

    useEffect(() => {
        if (!activeStock) return;
        
        const loadData = async () => {
            setLoading(true);
            const tsData = await fetchTimeSeries(activeStock.symbol);
            if (tsData) {
                const entries = Object.entries(tsData)
                    .map(([date, values]) => ({
                        date,
                        close: parseFloat(values['4. close'])
                    }))
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
                setData(entries);
            } else {
                setData([]);
            }
            setLoading(false);
        };
        
        loadData();
    }, [activeStock]);

    useEffect(() => {
        if (!data || !chartRef.current) return;

        let filteredData = [...data];
        const now = new Date(data[data.length - 1]?.date || Date.now()); 
        
        if (timeframe === '1W') {
            const weekAgo = new Date(now);
            weekAgo.setDate(weekAgo.getDate() - 7);
            filteredData = data.filter(d => new Date(d.date) >= weekAgo);
        } else if (timeframe === '1M') {
            const monthAgo = new Date(now);
            monthAgo.setMonth(monthAgo.getMonth() - 1);
            filteredData = data.filter(d => new Date(d.date) >= monthAgo);
        } else if (timeframe === '3M') {
            const threeMonthsAgo = new Date(now);
            threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
            filteredData = data.filter(d => new Date(d.date) >= threeMonthsAgo);
        }

        const labels = filteredData.map(d => d.date);
        const values = filteredData.map(d => d.close);
        
        const isPositive = values[values.length - 1] >= values[0];
        const lineColor = isPositive ? '#10b981' : '#ef4444';
        const gradientColor = isPositive ? 'rgba(16, 185, 129, 0.2)' : 'rgba(239, 68, 68, 0.2)';

        if (chartInstance.current) {
            chartInstance.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, gradientColor);
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        chartInstance.current = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: `${activeStock.symbol} Price`,
                    data: values,
                    borderColor: lineColor,
                    backgroundColor: gradient,
                    borderWidth: 2,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    intersect: false,
                    mode: 'index',
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(30, 41, 59, 0.9)',
                        titleColor: '#f8fafc',
                        bodyColor: '#f8fafc',
                        borderColor: 'rgba(255,255,255,0.1)',
                        borderWidth: 1,
                        padding: 10,
                        displayColors: false,
                        callbacks: {
                            label: function(context) {
                                const cur = activeStock?.currency || 'USD';
                                return formatTooltip(context.parsed.y, cur);
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { display: false, drawBorder: false },
                        ticks: { maxTicksLimit: 6, color: '#94a3b8' }
                    },
                    y: {
                        grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },
                        ticks: { color: '#94a3b8', callback: (val) => formatChartTick(val, activeStock?.currency || 'USD') }
                    }
                }
            }
        });
        
    }, [data, timeframe]);

    if (!activeStock) {
        return (
            <div className="glass-panel chart-section" style={{display:'flex', alignItems:'center', justifyContent:'center', height:'400px'}}>
                <div className="empty-state">
                    <span className="material-symbols-outlined">show_chart</span>
                    <p>종목을 선택하면 차트가 표시됩니다.</p>
                </div>
            </div>
        );
    }

    return (
        <div className="glass-panel chart-section">
            <div className="chart-header">
                <div className="chart-title">{activeStock.name} ({activeStock.symbol})</div>
                <div className="timeframe-selector">
                    {['1W', '1M', '3M', '1Y'].map(tf => (
                        <button 
                            key={tf}
                            className={`timeframe-btn ${timeframe === tf ? 'active' : ''}`}
                            onClick={() => setTimeframe(tf)}
                        >
                            {tf}
                        </button>
                    ))}
                </div>
            </div>
            {loading ? (
                <div className="spinner"></div>
            ) : (
                <div className="chart-container">
                    <canvas ref={chartRef}></canvas>
                </div>
            )}
        </div>
    );
};

const NewsSection = ({ activeStock }) => {
    const [news, setNews] = useState([]);
    const [loading, setLoading] = useState(false);

    useEffect(() => {
        if (!activeStock) return;
        setNews([]);
        const loadNews = async () => {
            setLoading(true);
            const isKorean = activeStock.isKorean !== false;
            const data = await fetchNews(activeStock.name, activeStock.symbol, isKorean);
            setNews((data || []).slice(0, 10));
            setLoading(false);
        };
        loadNews();
    }, [activeStock]);

    if (!activeStock) return null;

    return (
        <div className="news-section">
            <h2 className="news-header">
                <span className="material-symbols-outlined">newspaper</span>
                {activeStock.name} 관련 최신 뉴스
                <span style={{fontSize:'0.75rem', color:'var(--text-muted)', fontWeight:400, marginLeft:'0.5rem'}}>
                    {activeStock.isKorean !== false ? '(네이버 뉴스)' : '(Yahoo Finance)'}
                </span>
            </h2>
            {loading ? (
                <div className="spinner"></div>
            ) : news.length === 0 ? (
                <div className="empty-state">관련 뉴스가 없습니다.</div>
            ) : (
                <div className="news-list">
                    {news.map((item, idx) => (
                        <a key={idx} href={item.url} target="_blank" rel="noopener noreferrer" className="news-list-item">
                            <div className="news-list-num">{String(idx + 1).padStart(2, '0')}</div>
                            <div className="news-list-content">
                                <div className="news-list-title">{item.title}</div>
                                {item.summary && (
                                    <div className="news-list-summary">{item.summary}</div>
                                )}
                                <div style={{fontSize:'0.7rem', color:'var(--text-muted)', marginTop:'3px', display:'flex', gap:'0.5rem'}}>
                                    {item.source && <span>{item.source}</span>}
                                    {item.time_published && <span>{item.time_published}</span>}
                                </div>
                            </div>
                            <span className="material-symbols-outlined" style={{fontSize:'1.1rem', color:'var(--text-muted)', flexShrink:0}}>open_in_new</span>
                        </a>
                    ))}
                </div>
            )}
        </div>
    );
};

const App = () => {
    const [favorites, setFavorites] = useState([]);
    const [activeStock, setActiveStock] = useState(null);
    const [isSearchOpen, setIsSearchOpen] = useState(false);
    const [isAuthOpen, setIsAuthOpen] = useState(false);
    const [isProfileOpen, setIsProfileOpen] = useState(false);
    const [isAdminOpen, setIsAdminOpen] = useState(false);
    const [user, setUser] = useState(null);
    const [isAdmin, setIsAdmin] = useState(false);
    const [authLoading, setAuthLoading] = useState(true);
    const firestoreReady = useRef(false);

    useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((u) => {
            setUser(u);
            setAuthLoading(false);
        });
        return unsubscribe;
    }, []);

    useEffect(() => {
        if (!user) {
            setFavorites([]);
            setActiveStock(null);
            setIsAdmin(false);
            firestoreReady.current = false;
            return;
        }
        firestoreReady.current = false;
        db.collection('users').doc(user.uid).get().then(doc => {
            if (doc.exists && doc.data().favorites) {
                const favs = doc.data().favorites;
                setFavorites(favs);
                if (favs.length > 0) setActiveStock(favs[0]);
            }
            firestoreReady.current = true;
        });
        user.getIdToken().then(token =>
            fetch(`${BASE_URL.replace('/api','')}/api/admin/check`, { headers: { Authorization: `Bearer ${token}` } })
        ).then(r => r.json()).then(d => setIsAdmin(d.is_admin)).catch(() => {});
    }, [user]);

    useEffect(() => {
        if (!user || !firestoreReady.current) return;
        db.collection('users').doc(user.uid).set({ favorites }, { merge: true });
    }, [favorites, user]);

    const toggleFavorite = (stock) => {
        setFavorites(prev => {
            const exists = prev.some(f => f.symbol === stock.symbol);
            if (exists) {
                const newFavs = prev.filter(f => f.symbol !== stock.symbol);
                if (activeStock?.symbol === stock.symbol) {
                    setActiveStock(newFavs.length > 0 ? newFavs[0] : null);
                }
                return newFavs;
            } else {
                if (prev.length >= 7) {
                    alert("즐겨찾기는 최대 7개까지만 추가할 수 있습니다.");
                    return prev;
                }
                if (prev.length === 0) setActiveStock(stock);
                return [...prev, stock];
            }
        });
    };

    const handleLogout = () => auth.signOut();

    if (authLoading) {
        return (
            <div style={{display:'flex', alignItems:'center', justifyContent:'center', height:'100vh'}}>
                <div className="spinner"></div>
            </div>
        );
    }

    return (
        <div className="container">
            <header className="header">
                <h1>
                    <span className="material-symbols-outlined" style={{fontSize: '2.5rem', color: 'var(--accent-color)'}}>monitoring</span>
                    MarketPulse
                </h1>
                <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                    {user ? (
                        <>
                            <span style={{fontSize:'0.8rem', color:'var(--text-muted)'}}>{user.email}</span>
                            {isAdmin && (
                                <button className="btn" onClick={() => setIsAdminOpen(true)}
                                    style={{background:'rgba(251,191,36,0.15)', border:'1px solid rgba(251,191,36,0.3)'}}>
                                    <span className="material-symbols-outlined">admin_panel_settings</span>
                                    관리자
                                </button>
                            )}
                            <button className="btn" onClick={() => setIsSearchOpen(true)}>
                                <span className="material-symbols-outlined">star</span>
                                종목 검색
                            </button>
                            <button className="btn" onClick={() => setIsProfileOpen(true)}
                                style={{background:'transparent', border:'1px solid rgba(255,255,255,0.15)'}}>
                                <span className="material-symbols-outlined">manage_accounts</span>
                            </button>
                            <button className="btn" onClick={handleLogout}
                                style={{background:'transparent', border:'1px solid rgba(255,255,255,0.15)'}}>
                                <span className="material-symbols-outlined">logout</span>
                            </button>
                        </>
                    ) : (
                        <button className="btn" onClick={() => setIsAuthOpen(true)}>
                            <span className="material-symbols-outlined">login</span>
                            로그인
                        </button>
                    )}
                </div>
            </header>

            {!user ? (
                <div className="glass-panel" style={{padding: '3rem', textAlign: 'center', marginBottom: '2rem', color: 'var(--text-muted)'}}>
                    <span className="material-symbols-outlined" style={{fontSize:'3rem', display:'block', marginBottom:'1rem'}}>lock</span>
                    로그인하면 즐겨찾기 종목을 저장하고 어디서든 확인할 수 있습니다.
                    <br/>
                    <button className="btn" onClick={() => setIsAuthOpen(true)} style={{marginTop:'1.5rem'}}>
                        <span className="material-symbols-outlined">login</span>
                        로그인 / 회원가입
                    </button>
                </div>
            ) : favorites.length > 0 ? (
                <div className="favorites-container">
                    {favorites.map(fav => (
                        <FavoriteCard
                            key={fav.symbol}
                            favorite={fav}
                            isActive={activeStock?.symbol === fav.symbol}
                            onClick={setActiveStock}
                            onToggle={toggleFavorite}
                        />
                    ))}
                </div>
            ) : (
                <div className="glass-panel" style={{padding: '2rem', textAlign: 'center', marginBottom: '2rem', color: 'var(--text-muted)'}}>
                    즐겨찾기된 종목이 없습니다. 우측 상단의 '종목 검색' 버튼을 눌러 추가해주세요.
                </div>
            )}

            <div className="main-grid">
                <ChartSection activeStock={activeStock} />
                <NewsSection activeStock={activeStock} />
            </div>

            <AuthModal
                isOpen={isAuthOpen}
                onClose={() => setIsAuthOpen(false)}
            />
            <ProfileModal
                isOpen={isProfileOpen}
                onClose={() => setIsProfileOpen(false)}
                user={user}
            />
            <AdminModal
                isOpen={isAdminOpen}
                onClose={() => setIsAdminOpen(false)}
                currentUid={user?.uid}
            />
            <SearchModal
                isOpen={isSearchOpen}
                onClose={() => setIsSearchOpen(false)}
                favorites={favorites}
                toggleFavorite={toggleFavorite}
            />
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
